name: artscot
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12      # scpc-python needs >= 3.11
  - numpy
  - matplotlib
  - scipy
  - scikit-learn  
  - pandas
  - seaborn
  - nibabel
  - joblib
  - statsmodels
  - PyYaml
  - jupyterlab
  - ipykernel
  - nibabel=5.3.3
  - nilearn=0.13.1  
  - pip
  - pip:
      # SCPC spatial inference (Mueller & Watson 2022), pinned to the tested commit
      - "scpc-python @ git+https://github.com/spatial-spur/scpc-python@83716a88de329d834b7b981d9bab7d58791b1633"
